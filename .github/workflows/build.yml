name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: dotnet restore
        run: dotnet restore TolgeeDotNet.slnx

      - name: ビルド
        run: dotnet build TolgeeDotNet.slnx --configuration Release --no-restore
