name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.package-id }}
    runs-on: ubuntu-latest
    environment: github-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-id: TolgeeDotNet.ApiClient.Kiota
            project-path: src/TolgeeDotNet.ApiClient.Kiota/TolgeeDotNet.ApiClient.Kiota.csproj
          - package-id: TolgeeDotNet.ApiClient.NSwag
            project-path: src/TolgeeDotNet.ApiClient.NSwag/TolgeeDotNet.ApiClient.NSwag.csproj
          - package-id: TolgeeDotNet.ApiClient.Refitter
            project-path: src/TolgeeDotNet.ApiClient.Refitter/TolgeeDotNet.ApiClient.Refitter.csproj

    env:
      PACKAGE_OUTPUT: artifacts/nuget
      NUGET_SOURCE_NAME: github
      NUGET_SOURCE_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: バージョンを解決
        id: package-version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be a SemVer value like 1.2.3 or 1.2.3-beta.1." >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: dotnet restore
        run: dotnet restore "$PROJECT_PATH"
        env:
          PROJECT_PATH: ${{ matrix.project-path }}

      - name: ビルド
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore -p:Version="${{ steps.package-version.outputs.value }}"
        env:
          PROJECT_PATH: ${{ matrix.project-path }}

      - name: パッケージを作成
        run: dotnet pack "$PROJECT_PATH" --configuration Release --no-build --output "$PACKAGE_OUTPUT" -p:Version="${{ steps.package-version.outputs.value }}"
        env:
          PROJECT_PATH: ${{ matrix.project-path }}

      - name: GitHub Packages ソースを追加
        run: dotnet nuget add source "$NUGET_SOURCE_URL" --name "$NUGET_SOURCE_NAME" --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Packages に公開
        run: dotnet nuget push "$PACKAGE_OUTPUT/$PACKAGE_ID.${{ steps.package-version.outputs.value }}.nupkg" --api-key "$GITHUB_TOKEN" --source "$NUGET_SOURCE_NAME"
        env:
          PACKAGE_ID: ${{ matrix.package-id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
